<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Thank you | PerceptFolio</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#0e0f12">
<link rel="icon" href="./favicon.svg" type="image/svg+xml">
<style>
:root{
  --bg:#0e0f12;--panel:#16181d;--panel2:#1e2128;--border:#2b2f38;
  --text:#f2f3f5;--muted:#949aa6;--accent:#3b82f6;--green:#2ea043;--yellow:#d9a441;--brand2:#1f9e8c;
  --mono:ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,monospace;
}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--text);min-height:100vh;display:flex;flex-direction:column;
  font:15px/1.6 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;-webkit-font-smoothing:antialiased}
a{color:inherit;text-decoration:none}
.wrap{max-width:780px;margin:0 auto;padding:0 24px;width:100%}
nav{border-bottom:1px solid var(--border)}
.nav-in{display:flex;align-items:center;height:60px;gap:10px}
/* Same logo construction as the terminal. One mark everywhere. */
.logo{font-family:var(--mono);font-size:14px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;
  display:inline-flex;align-items:center;gap:7px}
.logo-mark{flex-shrink:0}
.logo-word{display:inline-flex;letter-spacing:-.01em}
.logo .c1{color:var(--text)}
.logo .c2{color:var(--brand2)}
main{flex:1;padding:64px 0 78px}
.check{width:52px;height:52px;border-radius:50%;display:grid;place-items:center;margin-bottom:24px;
  background:rgba(46,160,67,.14);border:1px solid rgba(46,160,67,.4)}
.check.wait{background:rgba(217,164,65,.14);border-color:rgba(217,164,65,.4)}
.check svg{width:24px;height:24px;stroke:var(--green);fill:none;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}
.check.wait svg{stroke:var(--yellow)}
.eyebrow{font:11px/1 var(--mono);letter-spacing:.16em;color:var(--muted);text-transform:uppercase;margin-bottom:14px}
h1{font-size:clamp(26px,4.4vw,38px);line-height:1.14;letter-spacing:-.024em;font-weight:780}
.lede{color:var(--muted);font-size:16.5px;line-height:1.68;max-width:60ch;margin-top:18px}
.steps{margin-top:38px;border:1px solid var(--border);border-radius:12px;overflow:hidden;background:var(--panel)}
.steps-head{padding:13px 20px;border-bottom:1px solid var(--border);background:var(--panel2);
  font:11px/1 var(--mono);letter-spacing:.09em;color:var(--muted);text-transform:uppercase}
.step{display:flex;gap:16px;padding:18px 20px;border-bottom:1px solid var(--border)}
.step:last-child{border-bottom:none}
.step-n{flex:none;width:26px;height:26px;border-radius:7px;background:var(--panel2);border:1px solid var(--border);
  display:grid;place-items:center;font:700 12px/1 var(--mono);color:var(--accent)}
.step h3{font-size:15px;font-weight:650;margin-bottom:5px}
.step p{color:var(--muted);font-size:14px;line-height:1.6}
.step a{color:var(--accent)}
.cta{display:flex;gap:12px;flex-wrap:wrap;margin-top:32px}
.btn{display:inline-flex;align-items:center;justify-content:center;padding:12px 22px;border-radius:9px;
  font-size:14.5px;font-weight:600;border:1px solid var(--border);background:var(--panel);color:var(--text);cursor:pointer;transition:.15s}
.btn:hover{border-color:#3d434f;background:var(--panel2)}
.btn-p{background:var(--accent);border-color:var(--accent);color:#fff}
.btn-p:hover{background:#2f6fd8;border-color:#2f6fd8}
.aside{margin-top:32px;border-left:3px solid var(--border);padding:2px 0 2px 20px;color:var(--muted);font-size:14px;line-height:1.66;max-width:64ch}
footer{border-top:1px solid var(--border);padding:24px 0;font-size:12.5px;color:var(--muted)}
.links{display:flex;gap:22px;flex-wrap:wrap}
.links a:hover{color:var(--text)}
</style>
</head>
<body>

<nav><div class="wrap nav-in"><a href="./" class="logo"><svg class="logo-mark" width="1.4em" height="1.4em" viewBox="0 0 40 40" xmlns="http://www.w3.org/2000/svg"><rect x="1.5" y="1.5" width="37" height="37" rx="9" fill="none" stroke="var(--border)" stroke-width="1.5"/><text x="5" y="28" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="21" font-weight="700" fill="var(--text)">P</text><text x="20" y="28" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="21" font-weight="700" fill="var(--brand2)">F</text></svg><span class="logo-word"><span class="c1">Percept</span><span class="c2">Folio</span></span></a></div></nav>

<main>
  <div class="wrap">
    <div class="check" id="mark">
      <svg viewBox="0 0 24 24"><polyline points="20 6 9 17 4 12"/></svg>
    </div>
    <div class="eyebrow" id="eyebrow">Confirmed</div>
    <h1 id="title">Thank you.</h1>
    <p class="lede" id="lede"></p>

    <div class="steps" id="steps"></div>

    <div class="cta" id="cta"></div>

    <div class="aside" id="aside"></div>
  </div>
</main>

<footer>
  <div class="wrap links">
    <a href="./">Home</a>
    <a href="/terminal/">Terminal</a>
    <a href="./#faq">FAQ</a>
    <a href="mailto:northbridgeai1@gmail.com">Contact</a>
  </div>
</footer>

<script>
/* =====================================================================
   Two pages in one file, switched by ?type=

     thanks.html?type=access    after credentials are issued to new staff
     thanks.html?type=request   after someone submits an access request

   Anything unrecognised falls back to the access view, since that is the
   one people are sent to deliberately and the copy still reads sensibly.
   ===================================================================== */
const CONTACT = 'northbridgeai1@gmail.com';
const type = (new URLSearchParams(location.search).get('type') || 'access').toLowerCase();

const views = {
  access: {
    eyebrow: 'Credentials issued',
    title: 'You\'re set up.',
    lede: 'Your terminal access is live. Three short steps before it is useful — about ten minutes in total. Do them once and you never touch them again.',
    wait: false,
    stepsHead: 'Setup — about 10 minutes',
    steps: [
      ['1','Connect a data key','The terminal does not resell market data; you bring your own free feed. Sign up at <a href="https://finnhub.io" target="_blank" rel="noopener">finnhub.io</a>, copy the key, and paste it into Settings. Two minutes, no card.'],
      ['2','Load the book','Portfolio → Add Holding. Shares or dollars, whichever you have to hand, then set the cash balance. Every other screen calculates from this. Client work goes in its own profile, never yours.'],
      ['3','Set the rules and run a review','Settings holds the numbers the whole system runs on: buy bar, sell bar, position cap, cash floor. Set them to what you actually believe, then hit Run review on Command.']
    ],
    cta: [['Open the terminal','/terminal/',true],['Read the FAQ','./#faq',false]],
    aside: 'One thing to expect so it is not a surprise: <b>the Call Scorecard will be empty for about ninety days.</b> A fixed-horizon record cannot be reconstructed backwards — the terminal has to be open on the anniversary to mark the price. Yours starts building the day you begin.'
  },
  request: {
    eyebrow: 'Request received',
    title: 'Got it — thank you.',
    lede: 'Your access request is in. Someone from the financial branch will reply, usually within two working days. Credentials are issued per person, so expect a short exchange before anything is provisioned.',
    wait: true,
    stepsHead: 'What happens next',
    steps: [
      ['1','Someone reads it','Not a queue and not an autoresponder. NorthBridge is small enough that your request is read by someone who can act on it.'],
      ['2','Role is confirmed','Access is granted per person and tied to what you will actually be doing with it. If the terminal is not the right tool for your work, you will be told that plainly.'],
      ['3','Credentials are issued','You will get a sign-in and a link back here with setup instructions. Credentials are individual and are not to be shared or reused across a team.']
    ],
    cta: [['Back to the front page','./',true]],
    aside: 'While you wait, the <a href="./#faq" style="color:var(--accent)">FAQ</a> covers what comes up most: where data is stored, what the market-data limits are, and why nothing the terminal outputs is investment advice.'
  }
};

const v = views[type] || views.access;

document.getElementById('eyebrow').textContent = v.eyebrow;
document.getElementById('title').textContent = v.title;
document.getElementById('lede').textContent = v.lede;
document.title = v.title.replace(/[.']/g,'') + ' | PerceptFolio';
if (v.wait) document.getElementById('mark').classList.add('wait');

document.getElementById('steps').innerHTML =
  '<div class="steps-head">' + v.stepsHead + '</div>' +
  v.steps.map(s =>
    '<div class="step"><div class="step-n">' + s[0] + '</div>' +
    '<div><h3>' + s[1] + '</h3><p>' + s[2] + '</p></div></div>').join('');

document.getElementById('cta').innerHTML =
  v.cta.map(c => '<a class="btn' + (c[2] ? ' btn-p' : '') + '" href="' + c[1] + '">' + c[0] + '</a>').join('') +
  '<a class="btn" href="mailto:' + CONTACT + '">Email the branch</a>';

document.getElementById('aside').innerHTML = v.aside;
</script>
</body>
</html>
