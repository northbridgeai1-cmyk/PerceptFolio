# The Worker's own config (the root wrangler.toml is for Pages). Deploy with:
#   npx wrangler deploy -c worker.wrangler.toml
# keep_vars: the dashboard holds ALLOWED_ORIGIN, MAIL_FROM and the like as plain variables; without
# this a deploy replaces them with nothing and CORS breaks. Secrets persist on their own.
name = "crimson-hat-6ad9"
main = "worker.js"
compatibility_date = "2026-09-01"
keep_vars = true

[[kv_namespaces]]
binding = "PF_SYNC"
id = "71ba2a59c5a746818a4d2446d3f75ac4"

# Cloudflare Email Routing sender. Delivers only to addresses verified in this zone's Email Routing,
# which is the operator's inbox: enough for request notifications with no third-party account.
# Enable Email Routing on perceptfolio.com in the dashboard and verify the destination address first.
[[send_email]]
name = "NOTIFY"

# Rate limiting at the edge (real sliding windows; KV counters cannot see a burst).
# RL_TIGHT for writes that create records; RL_LOOSE for lookups by code.
[[ratelimits]]
name = "RL_TIGHT"
namespace_id = "1001"
simple = { limit = 10, period = 60 }

[[ratelimits]]
name = "RL_LOOSE"
namespace_id = "1002"
simple = { limit = 30, period = 60 }

# RL_DATA for /data, the built-in market data: Finnhub's own sixty a minute, which is also the
# terminal's budget for itself, so a legitimate refresh (four to six calls a symbol) is never cut
# off here before Finnhub would cut it off anyway.
[[ratelimits]]
name = "RL_DATA"
namespace_id = "1003"
simple = { limit = 60, period = 60 }

# Cloudflare's own model, the fallback for the six lenses, the Map's pre-fill and the news summary
# when no Anthropic key is set or its account has no credit. Free daily allowance; no other account.
[ai]
binding = "AI"

# A2.3/A4.3. The daily marker and the notices. 21:40 UTC is after the US close on a trading
# day; the run itself checks the exchange calendar and the licence (it records why it did
# nothing when there is no licensed feed). Without this block scheduled() never fires.
[triggers]
# 21:40 UTC on weekdays: the nightly pass that marks the record and sends review notices.
# Every fifteen minutes from 13:00 to 21:45 UTC on weekdays: the news watcher, which is roughly
# 9am to 5:45pm New York across both halves of the year. scheduled() branches on which fired.
crons = ["40 21 * * 1-5", "*/15 13-21 * * 1-5"]
