<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Moved — PerceptFolio</title>
<meta name="robots" content="noindex">
<!-- ============================================================================
     /app.html — REDIRECT STUB. Do not restore the terminal to this path.
     ============================================================================

     For a long stretch this file WAS the terminal: 566 KB of application served
     from the root as app.html, while /terminal/ served the marketing page. The
     two had been uploaded to each other's paths. The consequences were not
     subtle — "Sign in" on the landing page pointed at /terminal/, which was the
     landing page, so the button reloaded the page it was on and there was no
     route into the terminal at all.

     That is fixed. The terminal is at /terminal/ and the landing page is at /.
     This stub exists because the broken layout was live long enough to leak:

       1. The old landing page linked here four separate times, so anyone who
          bookmarked "Sign in" has /app.html saved.
       2. It was, for a while, the ONLY working way to reach the terminal —
          the root 404'd — so it is the URL that got shared by hand.

     Keep this file. It is 1 KB and it is the difference between an old bookmark
     opening the terminal and an old bookmark opening nothing.
     ============================================================================ -->
<meta http-equiv="refresh" content="0; url=/terminal/">
<link rel="canonical" href="/terminal/">
<style>
  body{background:#0e0f12;color:#949aa6;font:15px/1.6 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
       display:grid;place-items:center;min-height:100vh;margin:0;text-align:center;padding:24px}
  a{color:#3b82f6}
</style>
</head>
<body>
  <div>
    <p>The terminal now lives at <a href="/terminal/">perceptfolio.com/terminal</a>.</p>
    <p style="font-size:13px">Redirecting. If nothing happens, use the link above and update your bookmark.</p>
  </div>
<script>
  /* replace(), not assign() — the old URL must not stay in history or Back will
     bounce the user straight back here. */
  location.replace('/terminal/');
</script>
</body>
</html>
