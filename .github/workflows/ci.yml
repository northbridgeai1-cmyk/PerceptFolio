# Every push and pull request: the whole suite, the billing and Kronos contracts, the site build,
# an audit, and a secret scan. On main, when a Cloudflare token exists in the repo's secrets, the
# assembled dist/ deploys to Pages. The Worker deploys separately, by hand, from worker.wrangler.toml.
name: ci
on:
  push:
    branches: [main, 'rebuild/**']
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-node@v4
        with: { node-version: '22', cache: 'npm', cache-dependency-path: site/package-lock.json }
      - name: Static suite
        run: node test/run.mjs
      - name: Worker contracts (billing, org, kronos) against an in-memory KV
        run: node test/billing.mjs
      - name: Site build and audit
        run: |
          npm --prefix site ci --no-audit --no-fund
          npm --prefix site run build
          npm --prefix site audit --audit-level=high
      - name: Secret scan
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Assemble Pages output
        run: node scripts/assemble.mjs
      - name: Deploy to Cloudflare Pages
        if: github.ref == 'refs/heads/main' && env.HAS_TOKEN == 'true'
        env:
          HAS_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN != '' }}
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: 643c2df2f71a7208ec2ccb61f9dab700
          command: pages deploy dist --project-name perceptfolio --branch main
      - name: Smoke test the live deployment
        if: github.ref == 'refs/heads/main' && env.HAS_TOKEN == 'true'
        env:
          HAS_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN != '' }}
        run: |
          B=https://perceptfolio.pages.dev
          test "$(curl -s -o /dev/null -w '%{http_code}' $B/)" = 200
          test "$(curl -s -o /dev/null -w '%{http_code}' $B/terminal/)" = 302
          curl -s -D - -o /dev/null $B/ | grep -qi "strict-transport-security"
